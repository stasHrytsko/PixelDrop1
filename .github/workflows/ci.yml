name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: typecheck / lint / test / build / e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes the Shell/Mechanic boundaries)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Meaningless in the template itself, where the placeholders are the point.
      # Keyed on the package name, not the repository name: a template forked as
      # game-template-, game-template-2 or anything else is still the template.
      # npm run new-game is what rewrites this name, and it is also what replaces
      # the placeholders — so the two can never disagree.
      - name: Template placeholders were replaced
        run: |
          if [ "$(node -p "require('./package.json').name")" = "game-template" ]; then
            echo "Package is still named game-template — placeholders are expected here. Skipping."
            exit 0
          fi
          npm run verify-template

  android:
    name: assembleDebug
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web assets
        run: npm run build

      # android/ is not committed in the template (docs/decisions.md D-003).
      # In a game repo it is committed and this step is a no-op.
      - name: Ensure the native project exists
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build a debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
